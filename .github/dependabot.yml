version: 2
updates:
  - package-ecosystem: docker
    directory: /model_wrappers/cddd/cddd_repo
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
    groups:
      docker-image-deps:
          applies-to: version-updates
          patterns:
              - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /model_wrappers/KERMT
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      docker-image-deps:
          applies-to: version-updates
          patterns:
              - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /model_wrappers/graphmvp
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      docker-image-deps:
          applies-to: version-updates
          patterns:
              - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /model_wrappers/molbert
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      docker-image-deps:
          applies-to: version-updates
          patterns:
              - '*'
    cooldown:
      default-days: 7
